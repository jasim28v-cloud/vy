<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TITAN VORTEX | الأرشيف الوردي الفخم</title>
    
    <meta name="description" content="منصة TITAN ARCHIVE - الأرشيف الذكي للفيديوهات بتصميم زجاجي وردي فخم لعام 2026">
    <meta name="keywords" content="Titan, Archive, Vortex, فيديوهات وردية, تخزين سحابي">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://upload-widget.cloudinary.com/global/all.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Cairo:wght@400;700;900&display=swap');
        
        :root {
            --pink-neon: #ff007f;
            --glass-bg: rgba(255, 0, 127, 0.05);
            --border-pink: rgba(255, 0, 127, 0.2);
        }

        body {
            margin: 0; padding: 0; background: radial-gradient(circle at center, #1a0510 0%, #000 100%);
            color: #fff; font-family: 'Cairo', sans-serif; overflow: hidden;
        }

        /* هيدر زجاجي فخم */
        header {
            height: 80px; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(25px);
            border-bottom: 2px solid var(--border-pink); display: flex;
            align-items: center; justify-content: space-between; padding: 0 25px;
            position: fixed; top: 0; width: 100%; z-index: 1000;
        }
        
        .logo-text { font-family: 'Orbitron'; font-weight: 900; font-size: 26px; color: var(--pink-neon); text-shadow: 0 0 20px var(--pink-neon); }
        .logo-text span { color: #fff; }

        .btn-upload {
            background: #fff; color: #000; padding: 10px 24px; border-radius: 50px;
            font-family: 'Orbitron'; font-weight: 900; font-size: 13px;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.4); transition: 0.4s;
        }
        .btn-upload:hover { transform: scale(1.1); background: var(--pink-neon); color: #fff; }

        /* منطقة الفيديوهات */
        .feed-container { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; padding-top: 80px; padding-bottom: 90px; }
        .feed-container::-webkit-scrollbar { display: none; }

        .video-box {
            height: calc(100vh - 190px); width: calc(100vw - 30px); margin: 15px auto;
            scroll-snap-align: center; position: relative; border-radius: 40px;
            border: 2px solid var(--border-pink); overflow: hidden;
            box-shadow: 0 15px 50px rgba(0,0,0,0.8); background: #000;
        }
        video { width: 100%; height: 100%; object-fit: cover; }

        /* الأزرار الجانبية الزجاجية */
        .actions-bar { position: absolute; right: 20px; bottom: 60px; display: flex; flex-direction: column; gap: 20px; z-index: 100; }
        .action-item {
            width: 60px; height: 60px; background: var(--glass-bg); backdrop-filter: blur(20px);
            border-radius: 50%; display: flex; flex-direction: column; align-items: center;
            justify-content: center; border: 1.5px solid var(--border-pink); cursor: pointer; transition: 0.3s;
        }
        .action-item:hover { transform: scale(1.15); border-color: #fff; box-shadow: 0 0 25px var(--pink-neon); }
        .stat-val { font-size: 11px; font-family: 'Orbitron'; color: #fff; margin-top: 3px; }

        /* نافذة التعليقات الوردية */
        #comment-drawer {
            position: fixed; bottom: 0; width: 100%; height: 65%; background: rgba(10, 5, 10, 0.95);
            backdrop-filter: blur(30px); border-radius: 40px 40px 0 0; z-index: 2000;
            display: none; flex-direction: column; border-top: 3px solid var(--pink-neon);
        }
        .drawer-header { padding: 25px; border-bottom: 1px solid rgba(255,255,255,0.05); color: var(--pink-neon); font-family: 'Orbitron'; font-weight: 900; }

        /* الفوتر المتوهج */
        footer {
            height: 90px; position: fixed; bottom: 0; width: 100%; background: rgba(0,0,0,0.9);
            backdrop-filter: blur(20px); display: flex; justify-content: space-around;
            align-items: center; border-top: 1px solid var(--border-pink); z-index: 1000;
        }
        .nav-icon { color: rgba(255,255,255,0.3); font-size: 26px; cursor: pointer; transition: 0.3s; }
        .nav-icon:hover { color: var(--pink-neon); text-shadow: 0 0 15px var(--pink-neon); }

        /* شاشة التحميل */
        #loading-overlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { width: 60px; height: 60px; border: 4px solid #111; border-top-color: var(--pink-neon); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <p class="mt-4 font-[Orbitron] text-[10px] text-pink-500 tracking-[5px]">INITIALIZING_TITAN_X</p>
    </div>

    <header>
        <div class="logo-text italic">TITAN<span>_ARCHIVE</span></div>
        <div class="btn-upload" id="start-upload">UPLOAD</div>
    </header>

    <main class="feed-container" id="video-feed"></main>

    <div id="comment-drawer">
        <div class="drawer-header flex justify-between px-8">
            <span>ARCHIVE_COMMENTS</span>
            <i class="fas fa-times cursor-pointer" onclick="toggleComments(false)"></i>
        </div>
        <div class="flex-1 overflow-y-auto p-6" id="comments-list"></div>
        <div class="p-6 bg-black/50 flex gap-4">
            <input type="text" id="new-comment" class="flex-1 bg-white/5 border border-pink-500/20 rounded-2xl p-4 outline-none" placeholder="أضف تعليقاً للأرشيف...">
            <button onclick="sendComment()" class="text-pink-500 font-bold px-6 bg-white/5 rounded-2xl">نشر</button>
        </div>
    </div>

    <footer>
        <i class="fas fa-th-large nav-icon" onclick="triggerAd()"></i>
        <i class="fas fa-bolt nav-icon" onclick="triggerAd()"></i>
        <i class="fas fa-plus-circle nav-icon" onclick="triggerAd()"></i>
        <i class="fas fa-shield-alt nav-icon" onclick="triggerAd()"></i>
    </footer>

    <script>
        // الضبط بناءً على صورك المرفقة
        const CONFIG = {
            dbUrl: "https://goodd-eb2fa-default-rtdb.firebaseio.com/", // من الصورة
            cloudName: "dmqyd0haj", // من الصورة
            preset: "Titan_preset", // من الصورة
            ads: [
                "https://www.effectivegatecpm.com/bxwxuk2f39?key=566216691dc8b76a740840e94f68f44c",
                "https://www.effectivegatecpm.com/k60w64w4gk?key=564f3d8cc4ac85949f218179b742495e"
            ]
        };

        firebase.initializeApp({ databaseURL: CONFIG.dbUrl });
        const db = firebase.database();
        let currentAd = 0;

        function triggerAd() { window.open(CONFIG.ads[currentAd], '_blank'); currentAd = (currentAd + 1) % CONFIG.ads.length; }

        // نظام الرفع السحابي
        const uploader = cloudinary.createUploadWidget({ 
            cloudName: CONFIG.cloudName, 
            uploadPreset: CONFIG.preset 
        }, (err, res) => {
            if (res.event === "success") {
                db.ref('vortex_data/').push({ url: res.info.secure_url, likes: 0, time: Date.now() });
                alert("تمت الأرشفة بنجاح!");
            }
        });
        document.getElementById("start-upload").onclick = () => uploader.open();

        // جلب البيانات الحقيقية
        db.ref('vortex_data').on('value', (snap) => {
            const feed = document.getElementById('video-feed');
            const data = snap.val();
            document.getElementById('loading-overlay').style.display = 'none';
            if(!data) return;

            feed.innerHTML = '';
            Object.keys(data).reverse().forEach(id => {
                const item = data[id];
                const card = document.createElement('div');
                card.className = 'video-box';
                card.innerHTML = `
                    <video loop playsinline src="${item.url}"></video>
                    <div class="actions-bar">
                        <div class="action-item" onclick="handleLike('${id}')">
                            <i class="fas fa-heart text-pink-500"></i>
                            <span class="stat-val">${item.likes || 0}</span>
                        </div>
                        <div class="action-item" onclick="openCommentsUI('${id}')">
                            <i class="fas fa-comment-dots text-white"></i>
                        </div>
                        <div class="action-item" onclick="triggerAd()">
                            <i class="fas fa-share-alt text-pink-300"></i>
                        </div>
                    </div>`;
                feed.appendChild(card);
            });
            observeVideos();
        });

        function handleLike(id) { triggerAd(); db.ref(`vortex_data/${id}/likes`).transaction(l => (l || 0) + 1); }

        let activeVideo = '';
        function openCommentsUI(id) { triggerAd(); activeVideo = id; toggleComments(true); loadArchiveComments(id); }
        function toggleComments(show) { document.getElementById('comment-drawer').style.display = show ? 'flex' : 'none'; }

        function loadArchiveComments(id) {
            db.ref(`vortex_comments/${id}`).on('value', s => {
                const list = document.getElementById('comments-list'); list.innerHTML = '';
                const vals = s.val();
                if(vals) Object.values(vals).forEach(c => {
                    list.innerHTML += `<div class="mb-4 p-4 bg-white/5 rounded-2xl border border-pink-500/10">
                        <span class="text-[10px] text-pink-500 block mb-1">TITAN_USER</span>
                        <p class="text-sm text-gray-200">${c.text}</p>
                    </div>`;
                });
            });
        }

        function sendComment() {
            const input = document.getElementById('new-comment');
            if(input.value.trim()) {
                db.ref(`vortex_comments/${activeVideo}`).push({ text: input.value, user: 'TITAN' });
                input.value = '';
            }
        }

        function observeVideos() {
            const observer = new IntersectionObserver(es => {
                es.forEach(e => {
                    const v = e.target.querySelector('video');
                    if(e.isIntersecting) v.play().catch(()=>{});
                    else { v.pause(); v.currentTime = 0; }
                });
            }, { threshold: 0.8 });
            document.querySelectorAll('.video-box').forEach(b => observer.observe(b));
        }

        document.addEventListener('click', () => { document.querySelectorAll('video').forEach(v => v.muted = false); }, {once: true});
    </script>
</body>
</html>
