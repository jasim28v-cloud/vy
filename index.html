<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VORTEX PINK | TITAN PRO 2026</title>
    <meta name="description" content="منصة فورتكس تيتان - تجربة فيديوهات زجاجية وردية فريدة لعام 2026">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://upload-widget.cloudinary.com/global/all.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Cairo:wght@400;700;900&display=swap');
        
        :root {
            --neon-pink: #ff69b4;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 105, 180, 0.2);
        }

        body {
            margin: 0; background: linear-gradient(135deg, #0a0a0a 0%, #4a0e2e 100%);
            color: #fff; font-family: 'Cairo', sans-serif; overflow: hidden;
        }

        /* هيدر زجاجي وردي */
        header {
            height: 75px; background: rgba(0,0,0,0.8); backdrop-filter: blur(20px);
            border-bottom: 2px solid var(--glass-border); display: flex;
            align-items: center; justify-content: space-between; padding: 0 25px;
            position: fixed; top: 0; width: 100%; z-index: 1000;
            box-shadow: 0 4px 20px rgba(255, 105, 180, 0.2);
        }
        .v-logo { font-family: 'Orbitron'; font-weight: 900; font-size: 24px; color: var(--neon-pink); text-shadow: 0 0 15px var(--neon-pink); }
        .up-btn { background: #fff; color: #000; padding: 8px 20px; border-radius: 50px; font-family: 'Orbitron'; font-weight: 900; font-size: 12px; cursor: pointer; transition: 0.4s; }
        .up-btn:hover { background: var(--neon-pink); box-shadow: 0 0 20px var(--neon-pink); color: #fff; }

        /* محرك الفيديوهات الزجاجي */
        .vortex-stream { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; padding-top: 75px; padding-bottom: 85px; }
        .vortex-stream::-webkit-scrollbar { display: none; }
        .video-card { 
            height: calc(100vh - 180px); width: calc(100vw - 40px); margin: 10px auto; 
            scroll-snap-align: center; position: relative; border-radius: 35px;
            border: 2px solid var(--glass-border); overflow: hidden; background: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        video { width: 100%; height: 100%; object-fit: cover; }

        /* أزرار التفاعل الجانبية */
        .side-actions { position: absolute; right: 20px; bottom: 50px; display: flex; flex-direction: column; gap: 20px; z-index: 100; }
        .action-circle { 
            width: 55px; height: 55px; background: var(--glass); backdrop-filter: blur(15px); 
            border-radius: 50%; display: flex; flex-direction: column; align-items: center; 
            justify-content: center; border: 1px solid var(--glass-border); cursor: pointer; transition: 0.3s;
        }
        .action-circle:hover { transform: scale(1.1); border-color: var(--neon-pink); box-shadow: 0 0 15px var(--neon-pink); }
        .stat { font-size: 11px; font-family: 'Orbitron'; color: #fff; margin-top: 2px; }

        /* نافذة التعليقات الفخمة */
        #comment-panel { 
            position: fixed; bottom: 0; width: 100%; height: 65%; background: rgba(10,10,10,0.95); 
            backdrop-filter: blur(25px); border-radius: 35px 35px 0 0; z-index: 2000; 
            display: none; flex-direction: column; border-top: 3px solid var(--neon-pink);
        }
        .comment-header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); color: var(--neon-pink); font-family: 'Orbitron'; font-weight: 900; }
        .comment-list { flex: 1; overflow-y: auto; padding: 20px; }
        .comment-input-area { padding: 20px; display: flex; gap: 10px; background: #000; }
        #com-input { flex: 1; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 15px; padding: 12px; color: #fff; outline: none; }

        /* الفوتر الزجاجي */
        footer { 
            height: 85px; position: fixed; bottom: 0; width: 100%; background: rgba(0,0,0,0.85); 
            backdrop-filter: blur(20px); display: flex; justify-content: space-around; 
            align-items: center; border-top: 1px solid var(--glass-border);
        }
        .f-icon { color: rgba(255,255,255,0.4); font-size: 24px; cursor: pointer; transition: 0.3s; }
        .f-icon:hover { color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink); transform: translateY(-3px); }

        #loader { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .ring { width: 50px; height: 50px; border: 3px solid #111; border-top-color: var(--neon-pink); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loader">
        <div class="ring"></div>
        <p class="mt-4 font-[Orbitron] text-[10px] text-pink-500 tracking-[3px]">TITAN_VORTEX_2026</p>
    </div>

    <header>
        <div class="v-logo italic">TITAN_VORTEX</div>
        <div class="up-btn" id="upload-trigger">UPLOAD_PINK</div>
    </header>

    <main class="vortex-stream" id="main-stream"></main>

    <div id="comment-panel">
        <div class="comment-header flex justify-between px-6">
            <span>PINK_COMMENTS</span>
            <i class="fas fa-times cursor-pointer" onclick="closeComments()"></i>
        </div>
        <div class="comment-list" id="comment-box"></div>
        <div class="comment-input-area">
            <input type="text" id="com-input" placeholder="اكتب تعليقك هنا...">
            <button onclick="postComment()" class="text-pink-500 font-bold px-4">إرسال</button>
        </div>
    </div>

    <footer>
        <i class="fas fa-home f-icon" onclick="openAd()"></i>
        <i class="fas fa-fire f-icon" onclick="openAd()"></i>
        <i class="fas fa-plus-circle f-icon" onclick="openAd()"></i>
        <i class="fas fa-user-circle f-icon" onclick="openAd()"></i>
    </footer>

    <script>
        // --- بياناتك الشخصية المدمجة ---
        const MY_USER = 'TITAN_' + Math.random().toString(36).substr(2, 3).toUpperCase();
        const firebaseConfig = { databaseURL: "https://goodd-eb2fa-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const CLOUD_NAME = "dmqyd0haj"; 
        const UPLOAD_PRESET = "Titan_preset"; 

        // روابط أرباحك المفعلة
        const AD_LINKS = [
            "https://www.effectivegatecpm.com/bxwxuk2f39?key=566216691dc8b76a740840e94f68f44c",
            "https://www.effectivegatecpm.com/k60w64w4gk?key=564f3d8cc4ac85949f218179b742495e"
        ];
        let adCounter = 0;
        function openAd() { window.open(AD_LINKS[adCounter], '_blank'); adCounter = (adCounter + 1) % AD_LINKS.length; }

        // نظام الرفع
        const myWidget = cloudinary.createUploadWidget({ cloudName: CLOUD_NAME, uploadPreset: UPLOAD_PRESET }, (err, res) => {
            if (res.event === "success") {
                db.ref('vortex_stream/').push({ url: res.info.secure_url, likes: 0, timestamp: Date.now() });
                alert("تم الرفع بنجاح للسحابة الوردية!");
            }
        });
        document.getElementById("upload-trigger").onclick = () => { myWidget.open(); };

        // جلب وعرض البيانات
        db.ref('vortex_stream').on('value', (snap) => {
            const container = document.getElementById('main-stream');
            const data = snap.val();
            document.getElementById('loader').style.display = 'none';
            if(!data) return;
            container.innerHTML = '';
            Object.keys(data).reverse().forEach(id => {
                const v = data[id];
                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <video loop playsinline src="${v.url}"></video>
                    <div class="side-actions">
                        <div class="action-circle" onclick="likeVideo('${id}')">
                            <i class="fas fa-heart text-pink-500"></i>
                            <span class="stat">${v.likes || 0}</span>
                        </div>
                        <div class="action-circle" onclick="openComments('${id}')">
                            <i class="fas fa-comment-dots text-white"></i>
                        </div>
                        <div class="action-circle" onclick="shareVideo()">
                            <i class="fas fa-share text-pink-300"></i>
                        </div>
                    </div>`;
                container.appendChild(card);
            });
            initObserver();
        });

        function likeVideo(id) { openAd(); db.ref(`vortex_stream/${id}`).transaction(p => { if(p) p.likes = (p.likes || 0) + 1; return p; }); }

        let activeId = '';
        function openComments(id) { openAd(); activeId = id; document.getElementById('comment-panel').style.display = 'flex'; loadComments(id); }
        function closeComments() { document.getElementById('comment-panel').style.display = 'none'; }

        function loadComments(id) {
            db.ref(`comments/${id}`).on('value', snap => {
                const box = document.getElementById('comment-box'); box.innerHTML = '';
                const data = snap.val();
                if(data) Object.values(data).forEach(c => {
                    const div = document.createElement('div'); div.className = 'mb-3 p-3 bg-white/5 rounded-xl border border-white/5';
                    div.innerHTML = `<span class="text-[10px] text-pink-400 block">${c.user}</span><p class="text-sm">${c.text}</p>`;
                    box.appendChild(div);
                });
            });
        }

        function postComment() {
            const input = document.getElementById('com-input');
            if(input.value.trim()) { db.ref(`comments/${activeId}`).push({ user: MY_USER, text: input.value }); input.value = ''; }
        }

        function shareVideo() { openAd(); navigator.share({ title: 'Titan Vortex', url: window.location.href }); }

        function initObserver() {
            const obs = new IntersectionObserver((entries) => {
                entries.forEach(e => {
                    const v = e.target.querySelector('video');
                    if(e.isIntersecting) v.play().catch(()=>{});
                    else { if(v) { v.pause(); v.currentTime = 0; } }
                });
            }, { threshold: 0.7 });
            document.querySelectorAll('.video-card').forEach(c => obs.observe(c));
        }

        document.addEventListener('click', () => { document.querySelectorAll('video').forEach(v => v.muted = false); }, {once: true});
    </script>
</body>
</html>
