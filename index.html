<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TITAN VORTEX | REAL SYSTEM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://upload-widget.cloudinary.com/global/all.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Cairo:wght@400;700&display=swap');
        :root { --neon: #00f3ff; --dark: #000; }
        body { background: var(--dark); color: #fff; font-family: 'Cairo', sans-serif; margin: 0; overflow: hidden; }

        header { 
            height: 70px; background: rgba(0,0,0,0.85); backdrop-filter: blur(20px); 
            border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; 
            align-items: center; justify-content: space-between; padding: 0 20px; 
            position: fixed; top: 0; width: 100%; z-index: 1000;
        }
        .v-logo { font-family: 'Orbitron'; font-weight: 900; font-size: 22px; color: var(--neon); text-shadow: 0 0 15px var(--neon); }
        .up-btn { background: #fff; color: #000; padding: 8px 18px; border-radius: 50px; font-family: 'Orbitron'; font-weight: 900; font-size: 12px; cursor: pointer; }

        .vortex-stream { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; padding-top: 70px; padding-bottom: 80px; }
        .vortex-stream::-webkit-scrollbar { display: none; }
        .video-card { height: calc(100vh - 150px); width: 100vw; scroll-snap-align: start; position: relative; background: #000; border-bottom: 1px solid #111; }
        video { width: 100%; height: 100%; object-fit: cover; }

        .side-actions { position: absolute; right: 15px; bottom: 40px; display: flex; flex-direction: column; gap: 20px; z-index: 100; }
        .action-circle { width: 55px; height: 55px; background: rgba(255,255,255,0.08); backdrop-filter: blur(15px); border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; transition: 0.3s; }
        .stat { font-size: 11px; font-family: 'Orbitron'; color: var(--neon); font-weight: 900; }

        /* نافذة التعليقات */
        #comment-panel { position: fixed; bottom: 0; width: 100%; height: 60%; background: #0a0a0a; border-radius: 30px 30px 0 0; z-index: 2000; display: none; flex-direction: column; border-top: 2px solid var(--neon); }
        .comment-header { padding: 15px; text-align: center; border-bottom: 1px solid #222; font-family: 'Orbitron'; color: var(--neon); }
        .comment-list { flex: 1; overflow-y: auto; padding: 20px; }
        .comment-input-area { padding: 15px; display: flex; gap: 10px; background: #111; }

        #loader { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .ring { width: 50px; height: 50px; border: 3px solid #111; border-top-color: var(--neon); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        footer { height: 80px; position: fixed; bottom: 0; width: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); }
        .f-icon { color: rgba(255,255,255,0.4); font-size: 22px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="loader"><div class="ring"></div></div>

    <header>
        <div class="v-logo italic">TITAN_SYSTEM</div>
        <div class="up-btn" id="upload-action">UPLOAD</div>
    </header>

    <main class="vortex-stream" id="main-stream"></main>

    <div id="comment-panel">
        <div class="comment-header flex justify-between px-6">
            <span>COMMENTS_HUB</span>
            <i class="fas fa-times" onclick="closeComments()"></i>
        </div>
        <div class="comment-list" id="comment-box"></div>
        <div class="comment-input-area">
            <input type="text" id="com-input" class="flex-1 bg-white/5 border border-white/10 p-3 rounded-lg outline-none" placeholder="اكتب تعليقك...">
            <button onclick="postComment()" class="text-cyan-400 px-4 font-bold">إرسال</button>
        </div>
    </div>

    <footer>
        <i class="fas fa-home f-icon" onclick="openAd()"></i>
        <i class="fas fa-search f-icon" onclick="openAd()"></i>
        <i class="fas fa-plus-square f-icon" onclick="openAd()"></i>
        <i class="fas fa-user-secret f-icon" onclick="openAd()"></i>
    </footer>

    <script>
        // الهوية وقاعدة البيانات
        const MY_ID = 'USER_' + Math.random().toString(36).substr(2, 5).toUpperCase();
        const firebaseConfig = { databaseURL: "https://goodd-eb2fa-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const CLOUD_NAME = "dmqyd0haj"; 
        const UPLOAD_PRESET = "Titan_preset"; 

        // الإعلانات المطلوبة
        const AD_LINKS = [
            "https://www.effectivegatecpm.com/bxwxuk2f39?key=566216691dc8b76a740840e94f68f44c",
            "https://www.effectivegatecpm.com/k60w64w4gk?key=564f3d8cc4ac85949f218179b742495e"
        ];
        let adIdx = 0;
        function openAd() {
            window.open(AD_LINKS[adIdx], '_blank');
            adIdx = (adIdx + 1) % AD_LINKS.length;
        }

        // الرفع
        const myWidget = cloudinary.createUploadWidget({ cloudName: CLOUD_NAME, uploadPreset: UPLOAD_PRESET }, (err, res) => {
            if (res.event === "success") {
                db.ref('vortex_stream/').push({ url: res.info.secure_url, likes: 0, time: Date.now() });
                alert("تم الرفع للأرشيف!");
            }
        });
        document.getElementById("upload-action").onclick = () => { myWidget.open(); };

        // جلب البيانات
        db.ref('vortex_stream').on('value', (snap) => {
            const container = document.getElementById('main-stream');
            const data = snap.val();
            document.getElementById('loader').style.display = 'none';
            if(!data) return;

            container.innerHTML = '';
            Object.keys(data).reverse().forEach(id => {
                const v = data[id];
                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <video loop playsinline src="${v.url}"></video>
                    <div class="side-actions">
                        <div class="action-circle" onclick="likeVideo('${id}')">
                            <i class="fas fa-heart text-red-500"></i>
                            <span class="stat">${v.likes || 0}</span>
                        </div>
                        <div class="action-circle" onclick="openComments('${id}')">
                            <i class="fas fa-comment-dots text-white"></i>
                        </div>
                        <div class="action-circle" onclick="shareVideo()">
                            <i class="fas fa-share text-cyan-400"></i>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
            setupObserver();
        });

        // نظام الإعجاب الحقيقي
        function likeVideo(vId) {
            openAd(); // ربح عند الإعجاب
            db.ref(`vortex_stream/${vId}`).transaction(post => {
                if (post) { post.likes = (post.likes || 0) + 1; }
                return post;
            });
        }

        // نظام التعليقات الحقيقي
        let currentVideoId = '';
        function openComments(vId) {
            openAd(); // ربح عند فتح التعليقات
            currentVideoId = vId;
            document.getElementById('comment-panel').style.display = 'flex';
            loadComments(vId);
        }

        function closeComments() { document.getElementById('comment-panel').style.display = 'none'; }

        function loadComments(vId) {
            db.ref(`comments/${vId}`).on('value', snap => {
                const box = document.getElementById('comment-box');
                box.innerHTML = '';
                const data = snap.val();
                if(data) {
                    Object.values(data).forEach(c => {
                        const div = document.createElement('div');
                        div.className = 'mb-3 p-3 bg-white/5 rounded-xl border border-white/5';
                        div.innerHTML = `<span class="text-[10px] text-cyan-400 block">${c.user}</span><p class="text-sm">${c.text}</p>`;
                        box.appendChild(div);
                    });
                }
            });
        }

        function postComment() {
            const input = document.getElementById('com-input');
            if(input.value.trim()) {
                db.ref(`comments/${currentVideoId}`).push({ user: MY_ID, text: input.value });
                input.value = '';
            }
        }

        function shareVideo() { openAd(); navigator.share({ title: 'Vortex', url: window.location.href }); }

        function setupObserver() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(e => {
                    const vid = e.target.querySelector('video');
                    if(e.isIntersecting) vid.play().catch(()=>{});
                    else { if(vid) { vid.pause(); vid.currentTime = 0; } }
                });
            }, { threshold: 0.7 });
            document.querySelectorAll('.video-card').forEach(c => observer.observe(c));
        }

        document.addEventListener('click', () => { document.querySelectorAll('video').forEach(v => v.muted = false); }, {once: true});
    </script>
</body>
</html>
