<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TITAN ARCHIVE | VORTEX 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://upload-widget.cloudinary.com/global/all.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Cairo:wght@400;900&display=swap');
        :root { --neon: #00f3ff; --dark: #000; }
        body { background: var(--dark); color: #fff; font-family: 'Cairo', sans-serif; margin: 0; overflow: hidden; }

        header { 
            height: 70px; background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); 
            border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; 
            align-items: center; justify-content: space-between; padding: 0 20px; 
            position: fixed; top: 0; width: 100%; z-index: 1000;
        }
        .v-logo { font-family: 'Orbitron'; font-weight: 900; font-size: 22px; color: var(--neon); text-shadow: 0 0 15px var(--neon); }
        
        /* زر الرفع العلوي - نظيف وبدون إعلانات */
        .up-btn { background: #fff; color: #000; padding: 8px 18px; border-radius: 50px; font-family: 'Orbitron'; font-weight: 900; font-size: 12px; cursor: pointer; transition: 0.4s; }
        .up-btn:hover { transform: scale(1.05); box-shadow: 0 0 20px var(--neon); }

        .vortex-stream { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; padding-top: 70px; padding-bottom: 80px; }
        .vortex-stream::-webkit-scrollbar { display: none; }
        .video-card { height: calc(100vh - 150px); width: 100vw; scroll-snap-align: start; position: relative; background: #050505; border-bottom: 1px solid #111; }
        video { width: 100%; height: 100%; object-fit: cover; }

        .side-actions { position: absolute; right: 15px; bottom: 40px; display: flex; flex-direction: column; gap: 20px; z-index: 100; }
        .action-circle { width: 50px; height: 50px; background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; }
        .stat { font-size: 10px; font-family: 'Orbitron'; color: var(--neon); margin-top: 2px; }

        #loader { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .ring { width: 40px; height: 40px; border: 3px solid #111; border-top-color: var(--neon); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        footer { height: 80px; position: fixed; bottom: 0; width: 100%; background: rgba(0,0,0,0.95); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); }
        .f-icon { color: rgba(255,255,255,0.3); font-size: 20px; cursor: pointer; }
        .f-icon.active { color: var(--neon); text-shadow: 0 0 10px var(--neon); }
    </style>
</head>
<body>

    <div id="loader">
        <div class="ring"></div>
        <p class="mt-4 font-[Orbitron] text-[10px] tracking-widest text-cyan-400">SYNCING_TITAN_ARCHIVE</p>
    </div>

    <header>
        <div class="v-logo italic">TITAN_VORTEX</div>
        <div class="up-btn" id="upload-action">UPLOAD</div>
    </header>

    <main class="vortex-stream" id="main-stream"></main>

    <footer>
        <i class="fas fa-home f-icon active" onclick="openAd()"></i>
        <i class="fas fa-search f-icon" onclick="openAd()"></i>
        <i class="fas fa-bolt f-icon" onclick="openAd()"></i>
        <i class="fas fa-user f-icon" onclick="openAd()"></i>
    </footer>

    <script>
        // إعدادات Firebase من صورتك
        const firebaseConfig = { databaseURL: "https://goodd-eb2fa-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // إعدادات Cloudinary من صورتك
        const CLOUD_NAME = "dmqyd0haj"; 
        const UPLOAD_PRESET = "Titan_preset"; 

        // روابط الأرباح
        const AD_LINKS = [
            "https://www.effectivegatecpm.com/k60w64w4gk?key=564f3d8cc4ac85949f218179b742495e",
            "https://www.effectivegatecpm.com/bxwxuk2f39?key=566216691dc8b76a740840e94f68f44c"
        ];
        let adIdx = 0;
        function openAd() {
            window.open(AD_LINKS[adIdx], '_blank');
            adIdx = (adIdx + 1) % AD_LINKS.length;
        }

        // محرك الرفع النظيف
        const myWidget = cloudinary.createUploadWidget({
            cloudName: CLOUD_NAME,
            uploadPreset: UPLOAD_PRESET
        }, (err, res) => {
            if (res.event === "success") {
                db.ref('vortex_stream/').push({
                    url: res.info.secure_url,
                    likes: Math.floor(Math.random()*150),
                    time: Date.now()
                });
                alert("تم التخزين في الأرشيف بنجاح!");
            }
        });
        document.getElementById("upload-action").onclick = () => { myWidget.open(); };

        // عرض البيانات
        db.ref('vortex_stream').on('value', (snap) => {
            const container = document.getElementById('main-stream');
            const data = snap.val();
            document.getElementById('loader').style.display = 'none';
            if(!data) return;

            container.innerHTML = '';
            Object.keys(data).reverse().forEach(id => {
                const v = data[id];
                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <video loop playsinline src="${v.url}"></video>
                    <div class="side-actions">
                        <div class="action-circle" onclick="openAd()">
                            <i class="fas fa-heart text-red-500"></i>
                            <span class="stat">${v.likes}</span>
                        </div>
                        <div class="action-circle" onclick="openAd()">
                            <i class="fas fa-share text-cyan-400"></i>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
            setupObserver();
        });

        function setupObserver() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(e => {
                    const vid = e.target.querySelector('video');
                    if(e.isIntersecting) vid.play().catch(()=>{});
                    else { vid.pause(); vid.currentTime = 0; }
                });
            }, { threshold: 0.7 });
            document.querySelectorAll('.video-card').forEach(c => observer.observe(c));
        }

        document.addEventListener('click', () => {
            document.querySelectorAll('video').forEach(v => v.muted = false);
        }, {once: true});
    </script>
</body>
</html>
